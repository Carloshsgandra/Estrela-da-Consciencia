<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#060b1b"><meta name="robots" content="noindex,nofollow">
<title>Acesso administrativo — Instituto Estrela da Consciência</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,400;0,500;0,600;1,400&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/app.css"><script src="/theme.js"></script>
</head>
<body class="auth-shell admin-shell" data-mode="admin">
<a class="skip" href="#main">Ir para o conteúdo</a><div class="demo-strip">ACESSO RESTRITO <i>✦</i> ADMINISTRAÇÃO I.E.C.</div>
<header class="header"><div class="wrap header-inner"><a class="logo" href="/" aria-label="Administração do Instituto Estrela da Consciência"><img class="logo-mark" src="/iec-mark.svg" alt=""><span class="wordmark"><b>I.E.C.</b><small>ADMINISTRAÇÃO SEGURA</small></span></a><button id="theme-toggle" class="theme-toggle" aria-label="Alternar entre modo claro e escuro">Tema</button></div></header>
<main id="main" class="wrap section"><div class="auth-layout"><div><div class="eyebrow">CONTA AUTORIZADA</div><h1>Entrar no painel</h1><p>Use a conta administrativa cadastrada no Netlify Identity.</p></div><form class="panel" id="auth-form"><div class="field"><label for="auth-email">E-mail</label><input id="auth-email" name="email" type="email" autocomplete="email" required maxlength="180"></div><div class="field"><label for="auth-password">Senha</label><input id="auth-password" name="password" type="password" autocomplete="current-password" required minlength="8"></div><div id="auth-message" role="status" aria-live="polite"></div><button class="btn" id="auth-submit" type="submit">Entrar →</button></form></div></main>
<script type="module" src="/identity-client.js"></script>
</body></html>
