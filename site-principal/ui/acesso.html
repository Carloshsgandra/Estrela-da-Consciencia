<body class="auth-shell" data-mode="client">
<a class="skip" href="#main">Ir para o conteúdo</a><div class="demo-strip">PRESENÇA <i>✦</i> ACOLHIMENTO <i>✦</i> AUTOCONHECIMENTO</div>
<header class="header"><div class="wrap header-inner"><a class="logo" href="/" aria-label="Voltar ao Instituto Estrela da Consciência"><img class="logo-mark" src="/iec-mark.svg" alt=""><span class="wordmark"><b>I.E.C.</b><small>INSTITUTO ESTRELA DA CONSCIÊNCIA</small></span></a><button id="theme-toggle" class="theme-toggle" aria-label="Alternar entre modo claro e escuro">Tema</button></div></header>
<main id="main" class="wrap section"><div class="auth-layout"><div><div class="eyebrow">ACESSO PROTEGIDO</div><h1 id="auth-title">Abrir meu caderno</h1><p id="auth-intro">Use seu e-mail e senha para continuar com segurança.</p></div><form class="panel" id="auth-form"><div class="field" id="name-field" hidden><label for="auth-name">Como você gosta de ser chamada(o)?</label><input id="auth-name" name="name" autocomplete="name" minlength="2" maxlength="100"></div><div class="field"><label for="auth-email">E-mail</label><input id="auth-email" name="email" type="email" autocomplete="email" required maxlength="180"></div><div class="field"><label for="auth-password">Senha</label><input id="auth-password" name="password" type="password" autocomplete="current-password" required minlength="8"></div><div id="auth-message" role="status" aria-live="polite"></div><button class="btn" id="auth-submit" type="submit">Entrar →</button><button class="text-link" id="auth-toggle" type="button">Criar uma conta</button><a class="text-link" href="/">← Voltar ao site</a></form></div></main>
<script type="module" src="/identity-client.js"></script>
